const badgeDefs=[['深蹲貓','首次完成含深蹲的訓練',1],['棒式貓','首次完成含棒式的訓練',1],['舉重貓','首次完成器械訓練',1],['跑步貓','首次完成戶外跑步',1],['伸展貓','首次完成伸展訓練',1],['補給貓','累積記錄飲食 7 天',7],['持之以恆貓','累積完成運動 10 天',10],['休息貓','首次完成休息日打卡',1]];
function validNum(n,min=0,max=100000){return typeof n==='number'&&Number.isFinite(n)&&n>=min&&n<=max}
function validTarget(t){return t&&['k','p','c','f'].every(k=>validNum(t[k],k==='k'?800:0,k==='k'?6000:1000))}
function validState(s){if(!s||s.version!==1||!s.days||Array.isArray(s.days)||!s.body||Array.isArray(s.body)||!Array.isArray(s.seen))return false;if(s.profile){let p=s.profile;if(!validNum(p.age,18,100)||!validNum(p.height,100,230)||!validNum(p.weight,30,300)||!validNum(p.goalWeight,30,300)||!['m','f'].includes(p.sex)||![1.2,1.375,1.55,1.725].includes(p.activity)||!['減脂','增肌','維持'].includes(p.goal)||!validTarget(p.target)||typeof p.name!=='string'||p.name.length>60)return false}for(let [d,x]of Object.entries(s.days)){if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!x||!Array.isArray(x.meals)||!validTarget(x.target))return false;for(let m of x.meals)if(!m||typeof m.name!=='string'||m.name.length>150||!['早餐','午餐','晚餐','點心'].includes(m.meal)||!validNum(m.qty,.1,20)||!['k','p','c','f'].every(k=>validNum(m[k],0,10000)))return false;if(x.plan&&(!Number.isInteger(x.plan.id)||!templates[x.plan.id]||![10,20,30].includes(x.plan.time)||!['初學','已有習慣'].includes(x.plan.level)))return false;if(x.done&&!x.plan)return false;if(x.done&&x.rest)return false}for(let [d,b]of Object.entries(s.body)){if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!b||!validNum(b.w,30,300)||!(b.b===null||validNum(b.b,3,70))||!(b.m===null||validNum(b.m,5,100)))return false}return true}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('#storageNotice').hidden=true}catch(e){$('#storageNotice').hidden=false}checkBadges()}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function day(d=date,create=false){if(!state.days[d]&&create)state.days[d]={meals:[],target:{...(state.profile?.target||{k:2000,p:100,c:250,f:67})},plan:null,done:false,rest:false};return state.days[d]||{meals:[],target:state.profile?.target||{k:2000,p:100,c:250,f:67},plan:null,done:false,rest:false}}
function totals(d=date){return day(d).meals.reduce((a,m)=>{for(let k of ['k','p','c','f'])a[k]+=m[k]*m.qty;return a},{k:0,p:0,c:0,f:0})}
function marked(d){let x=day(d);return !!(x.meals.length||x.done||x.rest)}
function shift(d,n){let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return localDate(x)}
function stats(){let ds=Object.keys(state.days).filter(d=>d<=today);let streak=0,d=marked(today)?today:shift(today,-1);while(marked(d)){streak++;d=shift(d,-1)}return {food:ds.filter(d=>day(d).meals.length).length,exercise:ds.filter(d=>day(d).done).length,streak}}
function badgeProgress(){let days=Object.entries(state.days).filter(([d])=>d<=today).map(([,x])=>x), done=days.filter(x=>x.done&&x.plan);let has=t=>done.some(x=>templates[x.plan.id].tags.includes(t))?1:0;return [has('深蹲'),has('棒式'),done.some(x=>templates[x.plan.id].place==='器械')?1:0,has('跑步'),has('伸展'),days.filter(x=>x.meals.length).length,done.length,days.some(x=>x.rest)?1:0]}
function checkBadges(){let p=badgeProgress(),fresh=[];p.forEach((n,i)=>{if(n>=badgeDefs[i][2]&&!state.seen.includes(i)){state.seen.push(i);fresh.push(badgeDefs[i][0])}});if(fresh.length){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}setTimeout(()=>toast('✦ 解鎖貓咪徽章：'+fresh.join('、')),150)}}
const navs=[['today','◷','今日'],['food','◉','飲食'],['exercise','↗','運動'],['progress','▥','進度'],['badges','✧','徽章']];
function navigate(p){page=p;render();window.scrollTo({top:0,behavior:'instant'})}
function intro(en,title,desc){return `<div class="intro"><div><div class="eyebrow">${en}</div><h1>${title}</h1><p class="muted">${desc}</p></div><span class="pill">${esc(state.profile?.goal||'開始養成')}計畫 · 一起慢慢來</span></div>`}
function render(){ $('#date').value=date;$('#date').max=today;$('#nav').innerHTML=navs.map(([p,i,n])=>`<button class="${page===p?'active':''}" ${page===p?'aria-current="page"':''} onclick="navigate('${p}')"><span>${i}</span>${n}</button>`).join('');$('#view').innerHTML=({today:home,food:foodPage,exercise:exercisePage,progress:progressPage,badges:badgesPage})[page](); }
$('#date').onchange=e=>{if(e.target.value&&e.target.value<=today){date=e.target.value;render()}else e.target.value=date};
function home(){let x=day(),t=totals(),s=stats(),p=state.profile,tar=x.target;let reminder=x.done?'今天的訓練完成了！給認真的自己一點掌聲。':x.rest?'今天好好休息，也是在照顧自己的進度。':!x.meals.length?'先記下今天的第一餐，從一個小任務開始。':'每一份投入都算數。為今天留一點活動的時間吧。';return intro('A LITTLE BETTER, EVERY DAY',`${esc(p?.name||'你好')}，今天也一起加油。`,'照顧身體，也照顧自己的步調。')+`<div class="grid two"><div class="card coach"><div><div class="eyebrow">COACH'S NOTE · 教練小提醒</div><h2>${x.done?'做得很好，繼續累積！':'不用完美，開始就很好。'}</h2><p>${reminder}</p><button class="text" onclick="navigate('${x.meals.length?'exercise':'food'}')">${x.meals.length?'看看今日運動':'記錄我的一餐'} ↗</button></div>${cat(x.rest?7:x.done?6:0)}</div><div class="grid" style="grid-template-columns:1fr 1fr;gap:12px"><div class="card stat"><small>連續打卡</small><div class="big">${s.streak}<small style="display:inline;font-size:13px"> 天</small></div><small>每一步都有意義</small></div><div class="card stat"><small>累積運動</small><div class="big">${s.exercise}<small style="display:inline;font-size:13px"> 天</small></div><small>為自己存下能量</small></div></div></div><div class="grid two section"><div class="card"><div class="row"><h2>今日營養</h2><button class="text" onclick="navigate('food')">記錄飲食 ＋</button></div><div class="grid" style="grid-template-columns:1fr 1fr;align-items:center"><div><div class="ring" style="--pct:${Math.min(t.k/tar.k*100,100)}%"><div><div class="big">${Math.round(t.k)}</div><small>/ ${tar.k} kcal</small></div></div><p style="text-align:center;font-size:12px" class="muted">${t.k>tar.k?'已超過估算 '+Math.round(t.k-tar.k):'距離估算還有 '+Math.round(tar.k-t.k)} kcal</p></div><div>${[['p','蛋白質','#285b45'],['c','碳水化合物','#b69b6a'],['f','脂肪','#db9b72']].map(([k,n,c])=>`<div class="macro"><div class="row"><strong>${n}</strong><small>${Math.round(t[k])} / ${tar[k]} g</small></div><div class="bar"><i style="width:${Math.min(t[k]/(tar[k]||1)*100,100)}%;background:${c}"></i></div></div>`).join('')}<p class="muted" style="font-size:11px;margin-top:22px">數值為估算參考，無須每餐精準達標。</p></div></div></div><div class="card"><h2>今天的小任務 <span class="pill">${Number(!!x.meals.length)+Number(x.done||x.rest)} / 2</span></h2><div class="task row"><div><strong>記錄今天的飲食</strong><small>${x.meals.length?'已記錄 '+x.meals.length+' 個品項':'從第一餐開始了解自己'}</small></div><button class="secondary" onclick="navigate('food')">${x.meals.length?'✓ 查看':'去記錄'}</button></div><div class="task row"><div><strong>動一動，或好好休息</strong><small>${x.done?'訓練已完成':x.rest?'今天是休息日':'選擇適合今天的節奏'}</small></div><button class="secondary" onclick="navigate('exercise')">${x.done||x.rest?'✓ 查看':'去安排'}</button></div><div class="note">養成不靠少吃或過量運動。記錄、活動與休息，都值得被看見。</div></div></div><div class="grid two section"><div class="card">${calendar()}</div><div class="card"><div class="row"><h2>我的貓咪夥伴</h2><button class="text" onclick="navigate('badges')">全部徽章 ↗</button></div><div class="row">${cat(6)}<div><h3>${badgeProgress().filter((n,i)=>n>=badgeDefs[i][2]).length} / 8 枚已解鎖</h3><p class="muted">讓每一次努力，<br>變成一隻可愛的貓。</p></div></div></div></div>`}
function calendar(){let start=shift(date,-((new Date(date+'T12:00:00').getDay()+6)%7)+weekOffset*7),count=Array.from({length:7},(_,i)=>shift(start,i)).filter(d=>marked(d)).length;return `<div class="row"><h2 style="margin:0">養成足跡 <small style="font-size:12px">${count} / 7 天</small></h2><div><button class="text" onclick="weekOffset--;render()" aria-label="上一週">‹</button><button class="text" onclick="weekOffset++;render()" aria-label="下一週">›</button></div></div><small>${start} — ${shift(start,6)}</small><div class="calendar">${Array.from({length:7},(_,i)=>{let d=shift(start,i),x=day(d);return `<button ${d>today?'disabled':''} class="day ${marked(d)?'mark':''} ${d===date?'selected':''}" onclick="date='${d}';weekOffset=0;render()"><small>${'一二三四五六日'[i]}</small><b>${Number(d.slice(-2))}</b><em>${x.meals.length?'食':''}${x.done?' 動':x.rest?' 休':''}${!marked(d)?'·':''}</em></button>`}).join('')}</div><small>食：飲食紀錄　動：完成運動　休：休息日</small>`}
function foodPage(){let t=totals();return intro('EAT WELL, FEEL GOOD','每一餐，好好照顧自己。','記錄是為了了解自己，讓下一餐更有方向。')+`<div class="grid four">${[['k','熱量','kcal'],['p','蛋白質','g'],['c','碳水','g'],['f','脂肪','g']].map(([k,n,u])=>`<div class="card stat"><small>${n}</small><span class="big">${Math.round(t[k])}</span> <small style="display:inline">/ ${day().target[k]} ${u}</small></div>`).join('')}</div><div class="grid two section"><div class="card"><div class="row"><h2>挑選食物</h2><button class="text" onclick="customFood()">＋ 自訂食物</button></div><div class="filters"><input id="foodSearch" placeholder="搜尋雞胸、飯糰、豆漿…" aria-label="搜尋食物" value="${esc(foodSearch)}" oninput="foodSearch=this.value;renderFoods()"><select aria-label="食品分類" onchange="foodCategory=this.value;renderFoods()">${['全部','便利商店','連鎖店','一般食物'].map(c=>`<option ${c===foodCategory?'selected':''}>${c}</option>`).join('')}</select><select aria-label="加入餐別" onchange="mealType=this.value">${['早餐','午餐','晚餐','點心'].map(m=>`<option ${m===mealType?'selected':''}>${m}</option>`).join('')}</select></div><div id="foodlist" class="foodlist">${foodItems()}</div><div class="note">內建 32 筆為教學用通用品項估算，非特定品牌官方數值。連鎖店分類不代表特定店家商品。請以包裝標示為準，或自訂輸入。整理日期：2026-10-18。</div></div><div class="grid" style="align-content:start"><div class="card"><h2>今天吃了什麼？</h2>${mealsHTML()}</div><div class="card"><div class="row"><h2>下一餐靈感</h2><button class="text" onclick="recommend()">幫我搭配 ↗</button></div><p class="muted">依目前選擇的食品分類與剩餘額度，提供簡單組合。</p><div id="recommendations" class="muted">按「幫我搭配」，看看今天的餐點靈感。</div></div></div></div>`}
function foodItems(){let fs=foods.filter(f=>(foodCategory==='全部'||f.category===foodCategory)&&f.name.includes(foodSearch));return fs.length?fs.map(f=>`<div class="food row"><div><h3><span class="emoji">${f.emoji}</span>${esc(f.name)}</h3><small>${f.category} · ${f.portion} · 估算</small><small>${f.k} kcal　蛋白質 ${f.p} g</small></div><button class="secondary" onclick="addFood(${f.id})" aria-label="加入${f.name}">＋</button></div>`).join(''):'<div class="empty">找不到品項，試試其他關鍵字或自訂食物。</div>'}
function renderFoods(){$('#foodlist').innerHTML=foodItems()}
function addFood(id){let f=foods[id];day(date,true).meals.push({...f,id:cryptoId(),meal:mealType,qty:1});save();render();toast('已加入'+mealType+'：'+f.name)}
function cryptoId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function mealsHTML(){let x=day();if(!x.meals.length)return '<div class="empty">今天的餐盤還是空的。<br>從左側挑選食物，或新增自訂餐點。</div>';return ['早餐','午餐','晚餐','點心'].map(meal=>{let ms=x.meals.map((m,i)=>({...m,index:i})).filter(m=>m.meal===meal);return ms.length?`<h3 style="margin-top:18px">${meal}</h3>`+ms.map(m=>`<div class="meal"><div class="row"><strong>${esc(m.name)}</strong><button class="text" onclick="removeMeal(${m.index})" aria-label="刪除${esc(m.name)}">×</button></div><div class="row"><small>${Math.round(m.k*m.qty)} kcal · 蛋白質 ${Math.round(m.p*m.qty)} g</small><label>份數 <input type="number" min="0.1" max="20" step="0.1" value="${m.qty}" aria-label="${esc(m.name)}份數" onchange="quantity(${m.index},this.value)"></label></div></div>`).join(''):''}).join('')}
function removeMeal(i){day(date,true).meals.splice(i,1);save();render()}
function quantity(i,v){let n=Number(v);if(!validNum(n,.1,20)){toast('份數請輸入 0.1～20');render();return}day(date,true).meals[i].qty=n;save();render()}
function customFood(){openModal(`<h2>新增自訂食物</h2><form id="customForm" class="formgrid"><label class="full">食物名稱<input name="name" required maxlength="80"></label><label class="full">每份說明<input name="portion" required maxlength="80" placeholder="例如：一碗、150 g"></label>${[['k','熱量 kcal'],['p','蛋白質 g'],['c','碳水 g'],['f','脂肪 g']].map(([k,n])=>`<label>${n}<input name="${k}" type="number" min="0" max="10000" step="0.1" required></label>`).join('')}<label>餐別<select name="meal">${['早餐','午餐','晚餐','點心'].map(m=>`<option ${m===mealType?'selected':''}>${m}</option>`).join('')}</select></label><div class="full actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button>加入紀錄</button></div></form>`);$('#customForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),m={id:cryptoId(),name:f.get('name').trim(),portion:f.get('portion').trim(),meal:f.get('meal'),qty:1,category:'自訂'};if(!m.name)return;for(let k of ['k','p','c','f'])m[k]=Number(f.get(k));day(date,true).meals.push(m);save();closeModal();render();toast('已加入自訂食物')}}
let recommended=[];
function recommend(){let rem=day().target,tot=totals(),limit=Math.max(0,rem.k-tot.k),protein=Math.max(0,rem.p-tot.p),fs=foods.filter(f=>foodCategory==='全部'||f.category===foodCategory),pairs=[];for(let i=0;i<fs.length;i++)for(let j=i+1;j<fs.length;j++){let a=fs[i],b=fs[j],k=a.k+b.k,p=a.p+b.p;if(k<=limit&&k>=200&&p>=10)pairs.push({items:[a,b],k,p,score:Math.abs(p-Math.min(protein,35))*4+Math.abs(k-Math.min(limit,550))*.15})}pairs.sort((a,b)=>a.score-b.score);recommended=pairs.filter((x,i,all)=>i===0||!x.items.some(f=>all[0].items.includes(f))).slice(0,3);$('#recommendations').innerHTML=recommended.length?recommended.map((r,i)=>`<div class="meal"><strong>${r.items.map(f=>esc(f.name)).join(' ＋ ')}</strong><small>各 1 份 · ${r.k} kcal · 蛋白質 ${Math.round(r.p)} g</small><p style="font-size:12px">熱量落在剩餘估算額度內，提供一份蛋白質補給。</p><button class="secondary" onclick="addRecommendation(${i})">加入${mealType}</button></div>`).join(''):'<div class="empty">目前無合適組合。可調整分類或自行選擇；不需要為超過估算而跳過下一餐。</div>'}
function addRecommendation(i){for(let f of recommended[i].items)day(date,true).meals.push({...f,id:cryptoId(),meal:mealType,qty:1});save();render();toast('餐點組合已加入'+mealType)}
function exercisePage(){let x=day(),p=x.plan||{id:0,time:20,level:'初學'},tpl=templates[p.id];return intro('MOVE AT YOUR OWN PACE','為今天，存一點能量。','選擇適合自己的場地與時間，完成就是進步。')+`<div class="grid two"><div class="card"><h2>安排今日運動</h2><div class="formgrid"><label>運動場地<select id="place" onchange="workoutOptions()">${['居家','器械','戶外'].map(v=>`<option ${tpl.place===v?'selected':''}>${v}</option>`).join('')}</select></label><label>程度<select id="level"><option ${p.level==='初學'?'selected':''}>初學</option><option ${p.level==='已有習慣'?'selected':''}>已有習慣</option></select></label><label>可用時間<select id="duration">${[10,20,30].map(n=>`<option value="${n}" ${p.time===n?'selected':''}>${n} 分鐘</option>`).join('')}</select></label><label>訓練主題<select id="workout">${templates.map((t,i)=>t.place===tpl.place?`<option value="${i}" ${i===p.id?'selected':''}>${t.name}</option>`:'').join('')}</select></label></div><div class="actions"><button class="secondary" onclick="restDay()">${x.rest?'取消休息日':'今天好好休息'}</button><button onclick="choosePlan()">${x.plan?'更新安排':'產生今日安排'} ↗</button></div><div class="note">初學者先從輕量、能穩定呼吸的動作開始。不舒服時停止；器械不熟悉時請現場教練協助。<a href="https://www.nhs.uk/live-well/exercise/exercise-health-benefits/" target="_blank" rel="noopener">一般活動參考</a></div></div><div class="card coach"><div><div class="eyebrow">TODAY'S RHYTHM</div><h2>${x.rest?'休息，也是計畫的一部分。':x.done?'今天，已經為自己做到。':'找到舒服的節奏。'}</h2><p>${x.rest?'放鬆、補水、好好睡一覺。明天再繼續。':'不需要追上別人，只要照顧今天的自己。'}</p></div>${cat(x.rest?7:2)}</div></div><div class="card section">${x.rest?'<h2>☾ 今日已完成休息日打卡</h2><p class="muted">這一天也會留在你的養成紀錄中。</p>':x.plan?planHTML(p,x.done):'<div class="empty">選好條件後，按「產生今日安排」。<br>也可以選擇休息日。</div>'}</div>`}
function workoutOptions(){let place=$('#place').value;$('#workout').innerHTML=templates.map((t,i)=>t.place===place?`<option value="${i}">${t.name}</option>`:'').join('')}
function choosePlan(){let x=day(date,true);if(x.done&&!confirm('更換安排會取消這一天的完成打卡，確定繼續？'))return;x.plan={id:Number($('#workout').value),time:Number($('#duration').value),level:$('#level').value};x.done=false;x.rest=false;save();render();toast('今日訓練已安排')}
function planHTML(p,done){let t=templates[p.id],rounds=p.time/10,reps=p.level==='初學'?'8～10':'10～12',main=p.time-4;let details=t.moves.map(([n,h],i)=>{let dose=t.place==='戶外'?`${Math.round(main*(i===0?.55:i===1?.3:.15)*60)} 秒`:n==='棒式'?`每組 ${p.level==='初學'?15:25} 秒`:`每組 ${reps} 次（伸展以舒適幅度）`;return `<div class="exercise"><span class="num">0${i+1}</span><div><h3>${n} <span class="pill">${dose}</span></h3><small>${h}</small></div></div>`}).join('');return `<div class="row"><div><span class="pill">${t.place} · ${p.level} · 約 ${p.time} 分鐘</span><h2 style="margin-top:12px">${t.name}</h2></div>${cat(p.id===5?3:0)}</div><div class="workout">暖身 2 分鐘：原地走動、肩部繞圈、溫和活動關節。<br>${t.place==='戶外'?'主訓練約 '+main+' 分鐘，依下列時間依序完成。':'主訓練約 '+main+' 分鐘，共 '+rounds+' 輪；動作間休息 20～40 秒，提早完成可延長休息。'}<br>收操 2 分鐘：放慢呼吸，輕柔伸展腿部與肩背。</div>${details}<div class="actions"><button ${done?'class="secondary"':''} onclick="completeWorkout()">${done?'✓ 已完成 · 取消打卡':'完成訓練，留下腳印 ✓'}</button></div><small>時間為約略安排，請依身體感受調整；不必勉強完成。</small>`}
function completeWorkout(){let x=day(date,true);if(!x.plan)return;x.done=!x.done;x.rest=false;save();render();if(x.done)toast('訓練完成！今天也為自己努力了。')}
function restDay(){let x=day(date,true);if(x.done&&!confirm('改為休息日會取消運動完成紀錄，確定繼續？'))return;x.rest=!x.rest;x.done=false;save();render()}
function progressPage(){let keys=Object.keys(state.body).sort(),latest=state.body[keys.at(-1)],s=stats();return intro('SMALL STEPS, REAL PROGRESS','每一個腳印，都看得見。','留意長期趨勢，不必為單日的起伏著急。')+`<div class="grid three"><div class="card stat"><small>最新體重</small><div class="big">${latest?.w??'—'} <small style="display:inline;font-size:13px">kg</small></div><small>目標 ${state.profile?.goalWeight??'—'} kg</small></div><div class="card stat"><small>累積飲食紀錄</small><div class="big">${s.food} <small style="display:inline;font-size:13px">天</small></div><small>認識自己的日常</small></div><div class="card stat"><small>累積完成運動</small><div class="big">${s.exercise} <small style="display:inline;font-size:13px">天</small></div><small>一次一次，慢慢累積</small></div></div><div class="grid two section"><div class="card chartwrap"><div class="row"><h2>身體數據趨勢</h2><button class="secondary" onclick="bodyForm()">＋ 記錄數據</button></div><div class="filters"><select aria-label="圖表數據" onchange="chartMetric=this.value;render()">${[['w','體重 kg'],['b','體脂率 %'],['m','骨骼肌量 kg']].map(([v,l])=>`<option value="${v}" ${chartMetric===v?'selected':''}>${l}</option>`).join('')}</select></div>${chart()}<small>可手動填寫 InBody 數據。盡量在相似條件下測量，不必每天記錄。</small></div><div class="card">${calendar()}</div></div><div class="card section"><h2>身體數據紀錄</h2>${keys.length?keys.reverse().map(d=>{let b=state.body[d];return `<div class="row meal"><div><strong>${d}</strong><small>體重 ${b.w} kg · 體脂 ${b.b??'—'} % · 骨骼肌 ${b.m??'—'} kg</small></div><div><button class="text" onclick="bodyForm('${d}')">編輯</button><button class="text" onclick="deleteBody('${d}')">刪除</button></div></div>`}).join(''):'<div class="empty">還沒有身體數據，先留下第一筆紀錄吧。</div>'}</div>`}
function chart(){let entries=Object.entries(state.body).filter(([,b])=>b[chartMetric]!=null).sort(([a],[b])=>a.localeCompare(b));if(!entries.length)return '<div class="empty">目前沒有這項數據，新增一筆就能開始追蹤。</div>';let goal=Number(state.profile?.[{w:'goalWeight',b:'goalFat',m:'goalMuscle'}[chartMetric]])||null,vals=entries.map(([,b])=>b[chartMetric]),lo=Math.min(...vals,...(goal?[goal]:[]))-2,hi=Math.max(...vals,...(goal?[goal]:[]))+2;let first=new Date(entries[0][0]+'T12:00:00').getTime(),last=new Date(entries.at(-1)[0]+'T12:00:00').getTime(),xp=d=>40+(last===first?220:(new Date(d+'T12:00:00').getTime()-first)/(last-first)*450),yp=v=>160-(v-lo)/(hi-lo)*130;return `<div class="row"><small>起始 ${vals[0]} · 最新 ${vals.at(-1)}</small><small>目標 ${goal??'未設定'}</small></div><svg class="chart" viewBox="0 0 530 200" role="img" aria-label="${esc(chartMetric)}趨勢，起始${vals[0]}，最新${vals.at(-1)}">${[lo,(lo+hi)/2,hi].map(v=>`<path d="M40 ${yp(v)}H500" stroke="#e5e8de"/><text x="3" y="${yp(v)+4}">${v.toFixed(1)}</text>`).join('')}${goal?`<path d="M40 ${yp(goal)}H500" stroke="#d39b69" stroke-dasharray="5 5"/><text x="410" y="${yp(goal)-5}">目標 ${goal}</text>`:''}<polyline points="${entries.map(([d,b])=>`${xp(d)},${yp(b[chartMetric])}`).join(' ')}" stroke="#285b45" stroke-width="3" fill="none"/>${entries.map(([d,b])=>`<circle cx="${xp(d)}" cy="${yp(b[chartMetric])}" r="4" fill="#285b45"><title>${d}：${b[chartMetric]}</title></circle>`).join('')}<text x="40" y="192">${entries[0][0]}</text><text x="410" y="192">${entries.at(-1)[0]}</text></svg>`}
function bodyForm(d=date){let b=state.body[d]||{};openModal(`<h2>記錄身體數據</h2><form id="bodyForm" class="formgrid"><label class="full">日期<input name="date" type="date" value="${d}" max="${today}" required></label>${[['w','體重 kg',30,300],['b','體脂率 %（選填）',3,70],['m','骨骼肌量 kg（選填）',5,100]].map(([k,n,min,max])=>`<label ${k==='w'?'class="full"':''}>${n}<input name="${k}" type="number" min="${min}" max="${max}" step="0.1" value="${b[k]??''}" ${k==='w'?'required':''}></label>`).join('')}<div class="full actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button>儲存</button></div></form>`);$('#bodyForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),nd=f.get('date');if(nd>today)return;if(nd!==d&&state.body[nd]&&!confirm('此日期已有紀錄，要覆蓋嗎？'))return;state.body[nd]={w:+f.get('w'),b:f.get('b')?+f.get('b'):null,m:f.get('m')?+f.get('m'):null};if(nd!==d&&state.body[d])delete state.body[d];save();closeModal();render();toast('身體數據已儲存')}}
function deleteBody(d){if(confirm('確定刪除這筆身體數據？')){delete state.body[d];save();render()}}
function badgesPage(){let p=badgeProgress();return intro('YOUR LITTLE HALL OF FAME','努力，長成了貓咪的模樣。','每一枚徽章，都是你照顧自己的證明。')+`<div class="card coach" style="margin-bottom:24px"><div><div class="eyebrow">COLLECTION PROGRESS</div><h2>${p.filter((n,i)=>n>=badgeDefs[i][2]).length} / 8 枚貓咪健身徽章</h2><p>從第一次開始，到一次次累積。<br>按自己的節奏，慢慢收集就好。</p></div>${cat(6)}</div><div class="badgegrid">${badgeDefs.map(([n,desc,target],i)=>`<div class="card badge ${p[i]>=target?'':'locked'}">${cat(i)}<h3>${n}</h3><p>${desc}</p><div class="bar"><i style="width:${Math.min(p[i]/target*100,100)}%"></i></div><small>${p[i]>=target?'✦ 已解鎖':Math.min(p[i],target)+' / '+target+' · 尚未解鎖'}</small></div>`).join('')}</div><div class="note">徽章根據有效紀錄計算；取消或刪除紀錄後會同步更新。每一天重複打卡不會增加天數。</div>`}
function openModal(html){$('#modal').innerHTML=html;$('#modal').showModal()}
function closeModal(){$('#modal').close()}
function estimate(p){let bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161),k=Math.round(Math.max(1200,bmr*p.activity+(p.goal==='減脂'?-250:p.goal==='增肌'?200:0))/10)*10,protein=Math.round(p.weight*(p.goal==='維持'?1.2:1.6)),fat=Math.round(k*.3/9),carb=Math.max(0,Math.round((k-protein*4-fat*9)/4));return {k,p:protein,c:carb,f:fat}}
function settings(first=false){let p=state.profile||{name:'',age:25,sex:'f',height:165,weight:60,activity:1.375,goal:'維持',goalWeight:60,goalFat:'',goalMuscle:''};openModal(`<div class="row"><div><div class="eyebrow">LET'S GET TO KNOW YOU</div><h2>${first?'歡迎來到貓系體能':'個人設定與資料'}</h2></div>${cat(0)}</div><p class="muted">${first?'先建立你的起點，一起找到適合的日常節奏。':'更新設定會套用於今天及未來，歷史營養目標會保留。'}</p><form id="profileForm" class="formgrid"><label class="full">暱稱（選填）<input name="name" maxlength="40" value="${esc(p.name)}" placeholder="我們該怎麼稱呼你？"></label>${[['age','年齡',18,100,p.age],['height','身高 cm',100,230,p.height],['weight','目前體重 kg',30,300,p.weight],['goalWeight','目標體重 kg',30,300,p.goalWeight]].map(([k,n,min,max,v])=>`<label>${n}<input name="${k}" type="number" min="${min}" max="${max}" step="${k==='age'?1:.1}" value="${v}" required></label>`).join('')}<label>生理性別（僅用於估算）<select name="sex"><option value="f" ${p.sex==='f'?'selected':''}>女性</option><option value="m" ${p.sex==='m'?'selected':''}>男性</option></select></label><label>日常活動量<select name="activity">${[[1.2,'久坐'],[1.375,'輕度活動'],[1.55,'中度活動'],[1.725,'高度活動']].map(([v,n])=>`<option value="${v}" ${p.activity===v?'selected':''}>${n}</option>`).join('')}</select></label><label>主要目標<select name="goal">${['減脂','增肌','維持'].map(v=>`<option ${p.goal===v?'selected':''}>${v}</option>`).join('')}</select></label><label>目標體脂 %（選填）<input name="goalFat" type="number" min="3" max="70" step=".1" value="${p.goalFat??''}"></label><label>目標骨骼肌 kg（選填）<input name="goalMuscle" type="number" min="5" max="100" step=".1" value="${p.goalMuscle??''}"></label><div class="full note">InBody 的目前體脂與骨骼肌量，可在「進度 → 記錄數據」手動輸入。第一版適用一般成人；估算不作為醫療或營養處方。</div><details class="full"><summary>營養估算方式與手動目標</summary><p class="muted" style="font-size:12px">使用 <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5753973/" target="_blank" rel="noopener">Mifflin–St Jeor 公式</a>：10 × 體重 + 6.25 × 身高 − 5 × 年齡，男性加 5、女性減 161。活動係數依序為 1.2／1.375／1.55／1.725。以下為本作業的簡化規則：減脂減 250 kcal、增肌加 200 kcal；蛋白質每公斤 1.2 g（維持）或 1.6 g；脂肪占熱量約 30%，其餘分配為碳水。估算最低顯示 1200 kcal，此下限並非個人安全判定。可手動調整各項目標。</p><label><input name="manual" type="checkbox" style="width:auto" ${p.manual?'checked':''}> 使用下方手動營養目標（未勾選將重新估算）</label><div class="formgrid">${[['k','熱量 kcal',800,6000],['p','蛋白質 g',0,1000],['c','碳水 g',0,1000],['f','脂肪 g',0,1000]].map(([k,n,min,max])=>`<label>${n}<input name="target_${k}" type="number" min="${min}" max="${max}" step="1" value="${p.target?.[k]??({k:2000,p:100,c:250,f:67})[k]}"></label>`).join('')}</div></details><div class="full actions">${!first?'<button type="button" class="secondary" onclick="closeModal()">取消</button>':''}<button>${first?'開始我的養成旅程 ↗':'儲存設定'}</button></div></form><details style="margin-top:22px"><summary>資料備份與隱私</summary><p class="muted" style="font-size:12px">資料僅存於此瀏覽器，不會自動上傳。不同網址／瀏覽器不會同步，清除瀏覽器資料可能遺失紀錄，請定期匯出。</p><div class="actions"><button class="secondary" onclick="exportData()">匯出 JSON</button><button class="secondary" onclick="$('#importFile').click()">匯入備份</button><button class="text" onclick="clearData()">清除全部資料</button></div><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importData(this.files[0])"></details>`);$('#profileForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),q={name:f.get('name').trim(),sex:f.get('sex'),goal:f.get('goal')};for(let k of ['age','height','weight','activity','goalWeight'])q[k]=Number(f.get(k));for(let k of ['goalFat','goalMuscle'])q[k]=f.get(k)?Number(f.get(k)):null;q.manual=!!f.get('manual');q.target=q.manual?Object.fromEntries(['k','p','c','f'].map(k=>[k,Number(f.get('target_'+k))])):estimate(q);if(!validTarget(q.target)){toast('請檢查營養目標範圍');return}state.profile=q;for(let [d,x]of Object.entries(state.days))if(d>=today)x.target={...q.target};if(!Object.keys(state.body).length)state.body[today]={w:q.weight,b:null,m:null};save();closeModal();render();toast('設定已儲存，一起慢慢累積！')}}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='貓系體能備份-'+today+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(file){if(!file)return;try{if(file.size>5e6)throw Error();let s=JSON.parse(await file.text());if(!validState(s))throw Error();if(!confirm('匯入會覆蓋目前全部紀錄，確定繼續？'))return;state=s;save();closeModal();render();toast('備份已匯入')}catch{toast('備份格式不正確或超過 5 MB，未變更資料。')}}
function clearData(){if(!confirm('確定清除全部個人資料與紀錄？建議先匯出備份。'))return;state={version:1,profile:null,days:{},body:{},seen:[]};save();closeModal();render();settings(true)}
try{let raw=localStorage.getItem(KEY);if(raw){let x=JSON.parse(raw);if(validState(x))state=x;else throw Error()}}catch(e){setTimeout(()=>toast('無法讀取既有資料；請匯入有效備份或重新設定。'),300)}
render();if(!state.profile)setTimeout(()=>settings(true),250);
</script></body></html>
